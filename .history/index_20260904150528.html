<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense tracker</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>EXPENSE TRACKER</h1>
    <div class="grid">
      <section class="section">
        <h3>monthly expense</h3>
        <p>₹0</p>
      </section>

      <section class="section">
        <h3>income</h3>
        <p>₹0</p>
      </section>

      <section class="section">
        <h3>daily expense</h3>
        <p>₹0</p>
      </section>
    </div>

    <div class="buttons-grid">
      <button class="btn add-expense-button" onclick="showExpenseForm()">Add Expense</button>
      <button class="btn manage-expense-button">Manage expense</button>
    </div>

    <form action="get" method="post" class="expense-form form-hidden">
      <div class="form">
        <p>ADD YOUR DETAILS</p>

        <div class="formating">
          <label for="expense">Enter amount</label>
          <input type="number" id="expense" name="expense" />
        </div>

        <div class="formating">
          <label for="description">Enter description</label>
          <input type="text" id="description" name="description" />
        </div>

        <div class="formating">
          <label for="category">Select category</label>
          <select id="category" name="category">
            <option value="food">Food</option>
            <option value="petrol">Petrol</option>
            <option value="shopping">Shopping</option>
            <option value="transport">Transport</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="formating">
          <label for="date">Enter date</label>
          <input type="date" id="date" name="date" />
        </div>

        <div class="formating">
          <button class="save-expense-button" type="submit">Save expense</button>
        </div>
      </div>
    </form>
  </body>
</html>
